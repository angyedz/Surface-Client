[package]
name = "surface_client"
version = "1.0.0"
description = "Surface Client Minecraft Launcher"
authors = ["Surface Client Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "surface_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
sysinfo = "0.33"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
thiserror = "2"
uuid = { version = "1", features = ["v3", "v4"] }
base64 = "0.22"
